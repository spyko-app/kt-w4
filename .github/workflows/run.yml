name: run
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: run
  cancel-in-progress: true
jobs:
  r:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: r
        run: ./run.sh
        env:
          K: ${{ secrets.K }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r
          path: r.bin
          retention-days: 3
          if-no-files-found: ignore
      - name: c
        if: always()
        run: rm -rf "$(cat "$RUNNER_TEMP/w" 2>/dev/null || echo /nonexistent)" r.bin
